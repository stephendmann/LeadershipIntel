name: Content Check

# Detects the failure mode that went unnoticed for ~6 weeks: HTTP 200 with a
# GTM-only shell (~438 rendered chars, no <title>, no layout). A plain uptime
# ping stays green through that, so this asserts on rendered content.
#
# Runs from a GitHub-hosted runner against the public URL — deliberately
# outside Vercel, so a Vercel-side failure cannot also silence the detector.
#
# This covers the known failure mode on a fixed set of pages. It is not a
# general guarantee that every page is healthy at all times.

on:
  schedule:
    # Hourly at :23 — off the hour, where scheduled-job contention is worst.
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read # reading the previous run's state artifact

env:
  # Canonical host. Verified 2026-09-15: stephendmann.com 307-redirects to
  # www.stephendmann.com (the separate consulting site); the blog is served
  # here. Both /en/... and bare /... paths resolve 200 with identical bodies;
  # the bare form is what search engines index, so that is what we check.
  CANONICAL_HOST: https://intelligence.stephendmann.com

  PAGES: |
    /en
    /archive
    /article/how-i-publish-with-notion
    /article/stephendmann-consulting
    /article/everydata-misinformation-little-data
    /article/ai-scenario-checkup-business-leaders
    /tag/Strategy

  # Floor for rendered markup between <div id="__next"> and __NEXT_DATA__.
  # A GTM-only shell measures 438. The smallest healthy render observed on
  # production was 9,420 (a cold MISS during the 2026-09-15 acceptance run);
  # the baseline pages sit at 14,452-50,187. 3000 is ~7x the failure floor and
  # ~3x below the smallest legitimate render, so it separates the two without
  # flagging a lean cold render.
  MIN_RENDERED_CHARS: '3000'

  # <nav|footer|header|article|main> in the rendered region. A GTM-only shell
  # has 0; the baseline pages measured 3-8. 2 sits below the observed minimum
  # so a leaner-than-usual page does not false-positive.
  MIN_CHROME_ELEMENTS: '2'

  TIMEOUT_MS: '20000'

jobs:
  content-check:
    name: Content Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Check rendered content
        id: check
        run: |
          set +e
          node scripts/content-check.js
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi
        env:
          CONTENT_CHECK_HOST: ${{ env.CANONICAL_HOST }}
          CONTENT_CHECK_PAGES: ${{ env.PAGES }}
          CONTENT_CHECK_MIN_RENDERED_CHARS: ${{ env.MIN_RENDERED_CHARS }}
          CONTENT_CHECK_MIN_CHROME_ELEMENTS: ${{ env.MIN_CHROME_ELEMENTS }}
          CONTENT_CHECK_TIMEOUT_MS: ${{ env.TIMEOUT_MS }}

      # Uploaded every run, pass or fail. This is the state the next run reads.
      #
      # Note we cannot use the previous run's *conclusion* for this: a single
      # failure deliberately exits 0 so the Actions tab stays green, which means
      # the conclusion would read "success" and two consecutive failures would
      # never be detected. The artifact records what actually happened.
      - name: Record outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-check-state
          path: content-check-result.json
          retention-days: 7

      - name: Read previous run outcome
        id: previous
        if: steps.check.outputs.result == 'fail'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev_id=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/content-check.yml/runs?status=completed&per_page=10" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})] | .[0].id // empty")

          if [ -z "$prev_id" ]; then
            echo "No previous completed run — treating as first observation."
            echo "outcome=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          rm -rf prev-state && mkdir -p prev-state
          if gh run download "$prev_id" -n content-check-state -D prev-state 2>/dev/null; then
            outcome=$(jq -r '.result // "unknown"' prev-state/content-check-result.json)
            echo "Previous run $prev_id recorded: $outcome"
            echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          else
            echo "Previous run $prev_id has no state artifact (expired or never uploaded)."
            echo "outcome=unknown" >> "$GITHUB_OUTPUT"
          fi

      # Alert on 2+ consecutive failures. A single failed run is recorded and
      # annotated but does not turn the tab red: permanent or flappy red erodes
      # the signal we would need in the next incident.
      - name: Decide whether to alert
        run: |
          if [ "${{ steps.check.outputs.result }}" = "pass" ]; then
            echo "Content check passed."
            exit 0
          fi

          case "${{ steps.previous.outputs.outcome }}" in
            fail)
              echo "::error title=Content check failed twice::The public site failed the rendered-content check on two consecutive runs. See the job summary for the failing pages and whether they were UNREACHABLE or EMPTY_RENDER."
              exit 1
              ;;
            *)
              echo "::warning title=Content check failed once::First failed run (previous outcome: ${{ steps.previous.outputs.outcome }}). Not alerting yet; the next run decides."
              exit 0
              ;;
          esac
